name: web-artifact (temp test deps)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Build web (release)
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: caregiver-web-app
          path: build/web
