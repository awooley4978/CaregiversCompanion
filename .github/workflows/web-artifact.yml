name: web-artifact (temp test path)
# TEMPORARY testing tool: builds the Flutter web release and uploads the
# build/web tree as an artifact so the owner can test the real app in a mobile
# browser. NOT part of production CI. Safe to delete after use.
on:
  push:
    branches: [main]
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install deps
        run: flutter pub get
      - name: Build web (release)
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: caregiver-web-app
          path: build/web
          if-no-files-found: error
