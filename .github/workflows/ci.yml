name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

  # Regression gate for the Firestore security ruleset (firebase/firestore.rules).
  # Loads the REAL rules file and asserts the Phase-4 deny-by-default matrix
  # against the Firestore emulator. Runs independently of the Flutter build gate.
  rules-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # The Firestore emulator (which firebase-tools auto-downloads) is a JVM
      # app, and recent firebase-tools refuse to run with a JDK older than 21.
      # The ubuntu-latest image's default JDK is 17, so pin Java 21 explicitly
      # before the emulator-backed npm test step.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test deps
        run: npm install

      - name: Run Firestore rules tests (emulator)
        run: npm test
