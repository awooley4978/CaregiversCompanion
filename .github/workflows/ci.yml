name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # The water day filter compares DEVICE-LOCAL days, and this runner is UTC,
      # where the old raw-field comparison looked correct. Dart's toLocal()
      # honours TZ, so the timezone-sensitive files are re-run in a US zone where
      # the regression tests actually fail on the pre-fix code.
      - name: Test (non-UTC timezone)
        run: TZ=America/Chicago flutter test test/water_tracking_test.dart test/water_history_test.dart

      - name: Build web
        run: flutter build web --release

      # Publish the web build so the preview can be refreshed from CI instead of
      # a stale hand-built copy: /home/team/shared/stage-app-build.sh downloads
      # this artifact for a given commit and stages it into the preview's
      # public/app. Short retention — only the newest runs matter.
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
          if-no-files-found: error

  # Regression gate for the Firestore security ruleset (firebase/firestore.rules).
  # Loads the REAL rules file and asserts the Phase-4 deny-by-default matrix
  # against the Firestore emulator. Runs independently of the Flutter build gate.
  rules-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # The Firestore emulator (which firebase-tools auto-downloads) is a JVM
      # app, and recent firebase-tools refuse to run with a JDK older than 21.
      # The ubuntu-latest image's default JDK is 17, so pin Java 21 explicitly
      # before the emulator-backed npm test step.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test deps
        run: npm install

      - name: Run Firestore rules tests (emulator)
        run: npm test
